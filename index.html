<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayaran Dinner FEPDT</title>
<link rel="icon" href="https://www.ucbestari.edu.my/wp-content/uploads/2021/02/ucb.png" type="image/x-icon">
<!-- Memasukkan API SoundCloud Widget secara rasmi -->
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
    /* Tema Fantasi Mistik */
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #1b1035, #080417);
        color: #e0d5ff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        overflow-x: hidden;
    }

    #main-content {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        padding-bottom: 100px; 
        box-sizing: border-box;
    }

    /* Gaya Kandungan Header (Logo) */
    .header-content {
        width: 100%;
        max-width: 500px;
        padding: 20px 20px 0 20px;
        box-sizing: border-box;
        text-align: center;
    }

    .header-logos {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        background: rgba(25, 15, 50, 0.4);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid rgba(138, 43, 226, 0.3);
        backdrop-filter: blur(5px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .header-logos img {
        height: auto;
        max-height: 55px; /* Menyeragamkan ketinggian logo supaya seimbang */
        max-width: 45%;
        object-fit: contain;
        filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.5));
    }

    /* Kotak Borang Magis */
    #form-wrapper {
        background: rgba(25, 15, 50, 0.75);
        border: 2px solid #8a2be2;
        box-shadow: 0 0 25px rgba(138, 43, 226, 0.5), inset 0 0 15px rgba(138, 43, 226, 0.2);
        border-radius: 15px;
        padding: 30px;
        backdrop-filter: blur(10px);
        text-align: center;
        margin-top: 20px;
    }

    h2 {
        color: #ffd700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        margin-top: 0;
        font-family: 'Georgia', serif;
    }

    p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #d1c4e9;
    }

    hr {
        border: 0;
        height: 1px;
        background: linear-gradient(to right, transparent, #8a2be2, transparent);
        margin: 20px 0;
    }

    label {
        font-weight: bold;
        color: #b39ddb;
        display: inline-block;
        margin-bottom: 5px;
    }

    /* Input & Select Gaya Fantasi */
    input[type="text"], select, input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        background: rgba(10, 5, 25, 0.8);
        border: 1px solid #5e35b1;
        border-radius: 8px;
        color: #fff;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus, select:focus {
        outline: none;
        border-color: #ffd700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* Gaya Butang Borang Utama */
    button {
        background: linear-gradient(45deg, #4a148c, #8e24aa);
        border: 1px solid #ffd700;
        color: #ffd700;
        padding: 12px 25px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(142, 36, 170, 0.4);
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 15px;
    }

    button:hover {
        background: linear-gradient(45deg, #8e24aa, #4a148c);
        box-shadow: 0 0 15px #ffd700;
        transform: scale(1.02);
    }

    /* Butang Terapung Sihir Bintang & Muzik */
    .btn-magic-float {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(45deg, #0a9396, #005f73);
        border: 2px solid #94d2bd;
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(10, 147, 150, 0.6);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 0;
    }

    .btn-magic-float:hover {
        background: linear-gradient(45deg, #005f73, #0a9396);
        box-shadow: 0 0 25px #ffd700;
        transform: scale(1.1) rotate(15deg);
    }

    .qr-code-img {
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        max-width: 100%;
        height: auto;
    }

    #status {
        margin-top: 15px;
        font-weight: bold;
    }

    /* Container & Animasi Hujan Bintang */
    .star-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
    }

    .star {
        position: absolute;
        top: -50px;
        user-select: none;
        animation: fall linear forwards;
    }

    @keyframes fall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        90% {
            opacity: 1;
        }
        100% {
            transform: translateY(105vh) rotate(360deg);
            opacity: 0;
        }
    }

    #main-content a {
        color: #ffd700;
        text-decoration: none;
        display: inline-block;
        margin-top: 15px;
        font-weight: bold;
        border-bottom: 1px dashed #ffd700;
    }

    /* Menyembunyikan pemain SoundCloud supaya kekal kemas */
    #sc-player {
        display: none;
    }
</style>
</head>

<body>

<!-- Player SoundCloud (Disembunyikan) -->
<iframe id="sc-player" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/235597141&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false"></iframe>

<!-- Container untuk bintang jatuh -->
<div class="star-container" id="starContainer"></div>

<!-- Bahagian Logo Header -->
<div class="header-content">
    <div class="header-logos">
        <img src="https://www.ucbestari.edu.my/wp-content/uploads/2023/12/ucb-logo-heading-2.webp" alt="UCB Logo">
        <img src="https://pbs.twimg.com/media/HGVAyx7bsAAhAPI?format=jpg&name=small" alt="FEPDT Logo">
    </div>
</div>

<!-- Butang Terapung Bulat (Bawah Kanan) -->
<button class="btn-magic-float" onclick="triggerMagic()" title="Aktifkan Sihir & Muzik">✨</button>

<div id="main-content">

    <div id="form-wrapper">

        <h2>Bayaran Dinner FEPDT</h2>

        <p>
            Makan Malam FEPDT: Anugerah Dekan FEPDT & Pelancaran Hari AI Sedunia
        </p>

        <p>
            Sumai Hotel, Kuala Terengganu
        </p>

        <p>
            Tema: Fantasy
        </p>

        <p>
            Fee: RM70
        </p>

        <hr>

        <label>Scan Sini Untuk Bayaran</label>
        <br><br>

        <img
            class="qr-code-img"
            src="https://pbs.twimg.com/media/HKHtge1aQAArYiK?format=jpg&name=medium"
            alt="QR Code"
            width="300"
        >

        <br><br>

        <label>Nama</label>
        <br>
        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama penuh"
        >

        <br><br>

        <label>Kategori</label>
        <br>

        <select id="kategori">
            <option value="">-- Pilih Kategori --</option>
            <option value="Student">Student</option>
            <option value="Lecturer">Lecturer</option>
            <option value="Staff">Staff</option>
            <option value="Others">Others</option>
        </select>

        <br><br>

        <label>No Matrik (Optional)</label>
        <br>

        <input
            type="text"
            id="matrik"
            placeholder="Contoh: A22EC1234"
        >

        <br><br>

        <label>Jenis Dana/Yuran</label>
        <br>

        <select id="dana">
            <option value="">-- Pilih Kategori --</option>
            <option value="yuran dinner">yuran dinner RM70</option>
            <option value="dana luar">dana luar RM30</option>
        </select>

        <br><br>

        <label>Upload Resit</label>
        <br>

        <input
            type="file"
            id="file"
            accept="image/*,.pdf"
        >

        <br><br>

        <button onclick="submitData()">
            Hantar Bayaran
        </button>

        <div id="status"></div>

    </div>

</div>

<script>
const WHATSAPP_LINK = "https://wa.me/60123456789?text=Saya%20ingin%20bertanya%20mengenai%20status%20bayaran%20Dinner%20FEPDT";
const WEBAPP = "https://script.google.com/macros/s/AKfycbxrzbbjb6P15z7LsPFvOh8TbMuvWIcbY-hGxUgjKQ3hjs3FDRNPIHYNn3uwQYd1y0ZEzw/exec";

let rainInterval = null;
const widget = SC.Widget(document.getElementById('sc-player'));

function createStar() {
    const container = document.getElementById('starContainer');
    const star = document.createElement('div');
    star.classList.add('star');
    star.innerText = '⭐';

    const randomX = Math.random() * window.innerWidth;
    star.style.left = `${randomX}px`;

    const randomSize = Math.random() * 20 + 15;
    star.style.fontSize = `${randomSize}px`;

    const randomDuration = Math.random() * 2 + 1.5; 
    star.style.animationDuration = `${randomDuration}s`;

    if (Math.random() > 0.5) {
        star.style.filter = 'blur(1px)';
        star.style.opacity = '0.7';
    }

    container.appendChild(star);

    setTimeout(() => {
        star.remove();
    }, randomDuration * 1000);
}

function startStarRain() {
    if (rainInterval) return; 

    rainInterval = setInterval(createStar, 80);

    setTimeout(() => {
        clearInterval(rainInterval);
        rainInterval = null;
    }, 5000); 
}

function triggerMagic() {
    startStarRain();
    widget.play();
}

window.addEventListener('DOMContentLoaded', () => {
    setTimeout(startStarRain, 500); 
});

function showSuccessPage() {
    const container = document.getElementById("main-content");
    container.innerHTML = `
        <div id="form-wrapper">
            <h2>Bayaran Berjaya Dihantar!</h2>
            <p>Terima kasih atas pengesahan anda. Resit dan maklumat pendaftaran anda telah berjaya disimpan ke dalam sistem kami.</p>
            <p>Jumpa anda di Makan Malam FEPDT.</p>
            <a href="${WHATSAPP_LINK}" target="_blank">
                Hubungi Setiausaha (WhatsApp)
            </a>
        </div>
    `;
    triggerMagic(); 
}

function submitData(){
    const nama = document.getElementById("nama").value.trim();
    const kategori = document.getElementById("kategori").value;
    const matrik = document.getElementById("matrik").value.trim();
    const dana = document.getElementById("dana").value;
    const file = document.getElementById("file").files[0];

    if(!nama){
        alert("Sila masukkan nama");
        return;
    }
    if(!kategori){
        alert("Sila pilih kategori");
        return;
    }
    if(!dana){
        alert("Sila pilih jenis dana");
        return;
    }
    if(!file){
        alert("Sila upload resit");
        return;
    }

    document.getElementById("status").innerHTML = "⏳ Sedang memuat naik...";

    const reader = new FileReader();
    reader.onload = function(e){
        const base64 = e.target.result.split(",")[1];

        fetch(WEBAPP,{
            method:"POST",
            body:JSON.stringify({
                nama:nama,
                kategori:kategori,
                matrik:matrik,
                dana:dana,
                fileData:base64,
                fileName:file.name,
                mimeType:file.type
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.success){
                showSuccessPage();
            }else{
                document.getElementById("status").innerHTML = "❌ " + (data.error || "Ralat tidak diketahui");
            }
        })
        .catch(error => {
            document.getElementById("status").innerHTML = "❌ Ralat: " + error;
            console.error(error);
        });
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
